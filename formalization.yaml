      framework: Codex and Hive
      prompting_notes: Agent-assisted accepted source research, native Lean formalization, independently reviewed incubator extensions and separate module-name promotions.
  notes: Project-wide inference cost, elapsed time and peak memory are not measured.
review:
  status: "other: review and acceptance are revision-specific; consult the release records"
  notes: Prism is responsible within the shared maintainer team. Mathematical predecessors were independently reviewed and accepted in the incubator, including the exact-sequence/exact-functor, native-shift and finite-interval cochain Euler extensions. At original cochain-transfer preparation, the exact-functor and shift destination transfers were accepted for promotion maturity but unintegrated, this transfer was stacked on the accepted-unmerged shift branch, and the initial public-release state and earlier accepted parentless proposal were frozen and untouched. At CI-aware successor preparation on 2026-09-27, those predecessors had been integrated and their own reviewed releases verified; the unchanged cochain mathematics was combined with the accepted CI configuration. The cochain successor's affected review, native complete-graph checks, integration and own reviewed publication remained separate pending exact-revision decisions at that point. No source correspondence or source coverage is asserted here.
