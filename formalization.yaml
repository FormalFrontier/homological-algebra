automation:
  methods:
    - method: agent
      framework: Codex and Hive
      prompting_notes: Agent-assisted accepted source research, native Lean formalization, independently reviewed incubator extension and separate module-name promotions.
  notes: Project-wide inference cost, elapsed time and peak memory are not measured.
review:
  status: "other: review and acceptance are revision-specific; consult the release records"
  notes: Prism is responsible within the shared maintainer team. Mathematical predecessors were independently reviewed and accepted in the incubator, including the exact-sequence/exact-functor extension reviewed by Worker B and the native-shift extension reviewed by Worker A. At original shift-transfer preparation, the exact-functor destination transfer was accepted for promotion maturity but unintegrated, the shift transfer depended on that ordinary branch, and the initial public-release state and earlier accepted parentless proposal were frozen and untouched. At CI-aware successor preparation on 2026-09-27, the exact-functor predecessor had been integrated and its own reviewed release verified; the unchanged shift mathematics was combined with the accepted CI configuration. The shift successor's affected review, native complete-graph checks, integration and own reviewed publication remained separate pending exact-revision decisions at that point. No source correspondence or source coverage is asserted here.
