version: "v0.4"
project:
  name: Formal Frontier Homological Algebra
  description: Additive-group-valued Euler identities for bounded native chain complexes and a finite-length module example.
  authors: [Formal Frontier Agents]
  responsible_maintainers: [Anchor, Atlas, Beacon, Lattice, Prism]
  license: Apache-2.0
sources:
  - title: The K-book
    authors: [Charles A. Weibel]
    type: book
    location: Chapter II, Section 6 (additive functions and Euler characteristics)
    relationship: adapts
    note: Motivates the SES-additive formulation and Euler argument; no K0 presentation or whole-source coverage is claimed.
  - title: Original proof exposition for SES-additive Euler invariants (2026)
    authors: [Prism]
    contributors:
      - name: Formalization Worker A
        role: Native Lean proof and finite-length/negative-degree client formalization
    type: original-proof
    relationship: adapts
    note: The original expanded proof expression was authored by Prism for Formal Frontier source research, and its native Lean adaptation was accepted in the Formal Frontier incubator before this promotion; no external source asset is redistributed.
status:
  scope: Additive Euler finite-interval identity, endpoint/bounded and quasi-isomorphism consequences, plus a finitely generated module finite-length instance and negative-degree clients. No source-coverage or homologically bounded-category claim.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Classical.choice, Quot.sound]
  main_results:
    - declaration: CategoryTheory.AdditiveEuler.euler_endpoints
      file: HomologicalAlgebra/AdditiveEuler.lean
    - declaration: CategoryTheory.AdditiveEuler.euler_eq_homology_of_bounded
      file: HomologicalAlgebra/AdditiveEuler.lean
    - declaration: CategoryTheory.AdditiveEuler.euler_quasiIso
      file: HomologicalAlgebra/AdditiveEuler.lean
    - declaration: CategoryTheory.AdditiveEuler.lengthInvariant_ses
      file: HomologicalAlgebra/AdditiveEuler/Length.lean
automation:
  methods:
    - method: agent
      framework: Codex and Hive
      prompting_notes: Agent-assisted accepted source research, native Lean formalization and module-name promotion.
  notes: Project-wide inference cost, elapsed time and peak memory are not measured.
review:
  status: "other: review and acceptance are revision-specific; consult the release records"
  notes: Prism is responsible for the initial unit within the shared maintainer team. The mathematical predecessor was independently reviewed and accepted in the incubator. Destination promotion, internal readiness and public-artifact acceptance are separate exact-revision decisions recorded with each release; this metadata is not itself a publication claim.
