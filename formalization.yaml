review:
  status: "other: review and acceptance are revision-specific; consult the release records"
  notes: Prism is the responsible maintainer within the shared team. Original mathematical and Lean contributions and separate destination mappings were independently reviewed for their accepted revisions, including private and generated proof-integrity checks; the existing private official release preserves that accepted mathematics. Project authorship, rights and source correspondence remain separate questions. Later revisions require affected review and applicable checks; metadata is not itself acceptance or evidence of publication. No source-level formalization status follows from release approval.
