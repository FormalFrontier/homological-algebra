# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/99c678e569c7c4c0772db297c5ddd5e4c9b6322e/schema/v0.4.schema.json
version: "v0.4"
project:
  name: Formal Frontier Homological Algebra
  description: Additive-group-valued finite Euler sums for chain and cochain complexes, short exact sequences, exact functors and native cochain shifts, with finite-length and torsion-valued examples.
  authors: [Formal Frontier Agents]
  responsible_maintainers: [Anchor, Atlas, Beacon, Lattice, Prism]
  license: Apache-2.0
sources:
  - title: The K-book
    authors: [Charles A. Weibel]
    type: book
    location: Chapter II, Section 6 (additive functions and Euler characteristics)
    relationship: adapts
    note: Motivates the SES-additive formulation and Euler argument; no K0 presentation or whole-source coverage is claimed.
  - title: Original proof exposition for SES-additive Euler invariants (2026)
    authors: [Prism]
    contributors:
      - name: Formalization Worker A
        role: Core, finite-length and exact-functor native Lean proofs and clients; independent native-shift review
      - name: Formalization Worker B
        role: Native cochain-shift, finite-support and finite-interval cochain Euler Lean proofs and clients; independent exact-functor review
    type: original-proof
    relationship: adapts
    note: Prism authored the original expanded Euler proof exposition and exact-functor/degreewise-SES guidance, distinct from the native shift/reindexing implementation. Worker A wrote the core, finite-length and exact-functor Lean proofs and clients and reviewed the native shift; Worker B wrote the native shift/reindexing and finite-interval cochain Euler Lean proofs and clients and reviewed the exact-functor component. The mathematical predecessors were accepted in the private incubator before separate module-name promotions. No external source asset is redistributed. Upstream mathlib Single is credited to Kim Morrison (2021), SingleHomology to Joël Riou (2023), ShiftSequence to Joël Riou (2024), and opposite-complex work to Johan Commelin, Amelia Livingston and Joël Riou (2022).
status:
  scope: SES-additive finite-interval chain and cochain Euler identities, including both cochain endpoint images, neighbor-vanishing and term-bounded equalities, acyclic zero and common-term-supported quasi-isomorphism invariance; finite-length module instance, degreewise-SES signed term and bounded homology additivity, exact-functor transport and mapped homology comparison; finite-support independence and reindexing, actual native cochain-shift term and homology sums, with negative-degree split-SES, identity-functor, negative/shifted ZMod 3 and nonzero-identity-differential boundary clients. No source-coverage, K0, homology-only bounded Euler, derived-category, long-exact-sequence or homologically bounded-category claim.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Classical.choice, Quot.sound]
  main_results:
    - declaration: CategoryTheory.AdditiveEuler.euler_endpoints
      file: HomologicalAlgebra/AdditiveEuler.lean
