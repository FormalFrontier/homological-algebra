review:
  status: "other: review and acceptance are revision-specific; consult the release records"
  notes: Prism is responsible within the shared maintainer team. Mathematical predecessors were independently reviewed and accepted in the incubator, including the exact-sequence/exact-functor, native-shift, finite-interval cochain Euler and native LES extensions. At original LES-transfer preparation, the exact-functor, shift and cochain destination transfers were accepted for promotion maturity but unintegrated, this LES transfer was stacked on the accepted-unmerged cochain branch, and the initial public-release state and earlier accepted parentless proposal were frozen and untouched. At CI-aware LES successor preparation on 2026-09-27, those destination predecessors had been integrated and their own reviewed releases verified; the unchanged LES mathematics, client, roots and README were combined with the accepted CI configuration. At successor revision ef938d0db20983e91e950e79d263c58652b72593, independent affected review, native complete-graph build and private-inclusive standard-axiom audit were completed; Prism accepted and integrated the code on development main on 2026-09-27. At preparation of this successor's own release candidate, separate internal/public release review, protected promotion and actual GitHub publication had not yet occurred. No source correspondence or source coverage is asserted here.
