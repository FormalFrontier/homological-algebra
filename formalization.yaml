version: "v0.4"
project:
  name: Formal Frontier Homological Algebra
  description: Additive-group-valued Euler identities for bounded native chain complexes, short exact sequences and exact functors, with finite-length module examples.
  authors: [Formal Frontier Agents]
  responsible_maintainers: [Anchor, Atlas, Beacon, Lattice, Prism]
  license: Apache-2.0
sources:
  - title: The K-book
    authors: [Charles A. Weibel]
    type: book
    location: Chapter II, Section 6 (additive functions and Euler characteristics)
    relationship: adapts
    note: Motivates the SES-additive formulation and Euler argument; no K0 presentation or whole-source coverage is claimed.
  - title: Original proof exposition for SES-additive Euler invariants (2026)
    authors: [Prism]
    contributors:
      - name: Formalization Worker A
        role: Native Lean proof and finite-length/negative-degree client formalization
    type: original-proof
    relationship: adapts
    note: Prism authored the original expanded proof expression and exact-functor/degreewise-SES exposition guidance; Formalization Worker A wrote the native Lean proofs and clients accepted in the Formal Frontier incubator before their separate module-name promotions. No external source asset is redistributed.
status:
  scope: Additive Euler finite-interval identity, endpoint/bounded and quasi-isomorphism consequences, finite-length module instance, degreewise-SES signed term and bounded homology additivity, exact-functor transport and mapped homology comparison, with negative-degree split-SES and identity-functor clients. No source-coverage, K0, long-exact-sequence or homologically bounded-category claim.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Classical.choice, Quot.sound]
  main_results:
    - declaration: CategoryTheory.AdditiveEuler.euler_endpoints
      file: HomologicalAlgebra/AdditiveEuler.lean
    - declaration: CategoryTheory.AdditiveEuler.euler_eq_homology_of_bounded
      file: HomologicalAlgebra/AdditiveEuler.lean
    - declaration: CategoryTheory.AdditiveEuler.euler_quasiIso
      file: HomologicalAlgebra/AdditiveEuler.lean
    - declaration: CategoryTheory.AdditiveEuler.lengthInvariant_ses
      file: HomologicalAlgebra/AdditiveEuler/Length.lean
    - declaration: CategoryTheory.AdditiveEuler.term_sum_additive_of_shortExact
      file: HomologicalAlgebra/AdditiveEuler/Functoriality.lean
    - declaration: CategoryTheory.AdditiveEuler.homology_sum_additive_of_shortExact
      file: HomologicalAlgebra/AdditiveEuler/Functoriality.lean
    - declaration: CategoryTheory.AdditiveEuler.map_homology_iso
      file: HomologicalAlgebra/AdditiveEuler/Functoriality.lean
    - declaration: CategoryTheory.AdditiveEuler.euler_map_bounded
      file: HomologicalAlgebra/AdditiveEuler/Functoriality.lean
automation:
  methods:
    - method: agent
      framework: Codex and Hive
      prompting_notes: Agent-assisted accepted source research, native Lean formalization, independently reviewed incubator extension and separate module-name promotions.
  notes: Project-wide inference cost, elapsed time and peak memory are not measured.
review:
  status: "other: review and acceptance are revision-specific; consult the release records"
  notes: Prism is responsible within the shared maintainer team. The mathematical predecessors were independently reviewed and accepted in the incubator, including the exact-sequence/exact-functor extension reviewed by Formalization Worker B; its transfer is a separate follow-on promotion. Destination promotion, internal readiness and publication are distinct exact-revision decisions recorded with each release; this metadata is not itself a publication claim.
