# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/99c678e569c7c4c0772db297c5ddd5e4c9b6322e/schema/v0.4.schema.json
version: "v0.4"
project:
  name: Formal Frontier Homological Algebra
  description: Additive-group-valued finite Euler sums for chain complexes, short exact sequences, exact functors and native cochain shifts, with finite-length and torsion-valued examples.
  authors: [Formal Frontier Agents]
  responsible_maintainers: [Anchor, Atlas, Beacon, Lattice, Prism]
  license: Apache-2.0
sources:
  - title: The K-book
    authors: [Charles A. Weibel]
    type: book
    location: Chapter II, Section 6 (additive functions and Euler characteristics)
    relationship: adapts
    note: Motivates the SES-additive formulation and Euler argument; no K0 presentation or whole-source coverage is claimed.
  - title: Original proof exposition for SES-additive Euler invariants (2026)
    authors: [Prism]
    contributors:
      - name: Formalization Worker A
        role: Core, finite-length and exact-functor native Lean proofs and clients; independent native-shift review
      - name: Formalization Worker B
        role: Native cochain-shift and finite-support Lean proofs and clients; independent exact-functor review
    type: original-proof
    relationship: adapts
    note: Prism authored the original expanded Euler proof exposition and exact-functor/degreewise-SES guidance, distinct from the new native shift/reindexing implementation. Worker A wrote the core, finite-length and exact-functor Lean proofs and clients and reviewed the native shift; Worker B wrote the native shift/reindexing Lean proofs and clients and reviewed the exact-functor component. The mathematical predecessors were accepted in the private incubator before separate module-name promotions. No external source asset is redistributed. Upstream mathlib Single is credited to Kim Morrison (2021), SingleHomology to Joël Riou (2023), and ShiftSequence to Joël Riou (2024).
status:
  scope: Additive Euler finite-interval identity, endpoint/bounded and quasi-isomorphism consequences, finite-length module instance, degreewise-SES signed term and bounded homology additivity, exact-functor transport and mapped homology comparison; finite-support independence and reindexing, actual native cochain-shift term and homology sums, with negative-degree split-SES, identity-functor and ZMod 3 cochain-shift clients. No source-coverage, K0, cochain Euler–Poincaré, derived-category, long-exact-sequence or homologically bounded-category claim.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Classical.choice, Quot.sound]
  main_results:
    - declaration: CategoryTheory.AdditiveEuler.euler_endpoints
      file: HomologicalAlgebra/AdditiveEuler.lean
    - declaration: CategoryTheory.AdditiveEuler.euler_eq_homology_of_bounded
      file: HomologicalAlgebra/AdditiveEuler.lean
    - declaration: CategoryTheory.AdditiveEuler.euler_quasiIso
      file: HomologicalAlgebra/AdditiveEuler.lean
    - declaration: CategoryTheory.AdditiveEuler.lengthInvariant_ses
      file: HomologicalAlgebra/AdditiveEuler/Length.lean
    - declaration: CategoryTheory.AdditiveEuler.term_sum_additive_of_shortExact
      file: HomologicalAlgebra/AdditiveEuler/Functoriality.lean
    - declaration: CategoryTheory.AdditiveEuler.homology_sum_additive_of_shortExact
      file: HomologicalAlgebra/AdditiveEuler/Functoriality.lean
    - declaration: CategoryTheory.AdditiveEuler.map_homology_iso
      file: HomologicalAlgebra/AdditiveEuler/Functoriality.lean
    - declaration: CategoryTheory.AdditiveEuler.euler_map_bounded
      file: HomologicalAlgebra/AdditiveEuler/Functoriality.lean
    - declaration: CategoryTheory.AdditiveEuler.signed_sum_eq_of_support
      file: HomologicalAlgebra/AdditiveEuler/Shift.lean
    - declaration: CategoryTheory.AdditiveEuler.signed_sum_translate
      file: HomologicalAlgebra/AdditiveEuler/Shift.lean
    - declaration: CategoryTheory.AdditiveEuler.term_sum_eq_of_support
      file: HomologicalAlgebra/AdditiveEuler/Shift.lean
    - declaration: CategoryTheory.AdditiveEuler.cochain_shift_term_support
      file: HomologicalAlgebra/AdditiveEuler/Shift.lean
    - declaration: CategoryTheory.AdditiveEuler.cochain_shift_term_sum
      file: HomologicalAlgebra/AdditiveEuler/Shift.lean
    - declaration: CategoryTheory.AdditiveEuler.cochain_shift_homology_iso
