version: "v0.4"
project:
  name: Formal Frontier Homological Algebra
  description: Finite Euler sums for chain and cochain complexes, with native exact-sequence, exact-functor and shift results, plus fixed-arrow relative paths of integer cochain maps in preadditive categories with binary biproducts and pullbacks, and an independent chosen-cokernel quotient-intersection pairing in abelian categories. It also constructs native quadrant bicomplex product totals over arbitrary rings and proves all-integer-degree acyclicity when every horizontal row is acyclic, including exactness at horizontal degree p=0 in each row. Includes admissible layers of chosen quotients, a reversed-lower/forward-upper order, and a lower-cut left-adjoint reflector under subobject/product closure and P(cokernel D.arrow), without quotient closure or endpoint admissibility. Also supplies the two exterior snake-sequence maps and proves the four middle exactness positions for an eight-object sequence in abelian categories; the endpoint universal properties and all six interior exactness positions hold without vanishing of the exterior objects. Also gives the canonical Fitting decomposition for endomorphisms of Noetherian and Artinian objects in arbitrary abelian categories, with kernel nilpotence, image invertibility and module-subobject agreement. These decompositions are natural for arbitrary intertwiners on a common tail; the copairing square at each exponent requires only the indicated kernels, images, image map and two biproducts. In a category with zero morphisms, nilpotent-to-monomorphic and epimorphic-to-nilpotent intertwiners vanish. For indecomposable Noetherian and Artinian objects, every endomorphism is nilpotent or a unit and the canonical, possibly noncommutative endomorphism ring is local. In any preadditive category with binary biproducts, locality of the canonical endomorphism ring implies indecomposability, without chain conditions or a chosen zero object. Separately, either an Artinian or a Noetherian object in a category with zero morphisms and finite biproducts admits a finite indecomposable biproduct decomposition, with an empty family for zero. In an abelian category, an object satisfying both chain conditions admits a finite biproduct decomposition with local canonical endomorphism rings on all factors. Such an object cancels from binary biproducts with arbitrary remaining objects. Finite families with local canonical endomorphism rings and isomorphic biproducts have matching factors, assuming only those two biproducts in a preadditive category. Every endomorphism of a Noetherian and Artinian object in an abelian category has a canonical Drazin inverse, with characteristic equations, unique existence, nilpotent, isomorphism and idempotent comparisons, and an idempotent projector. The kernel and image subobjects of sufficiently high powers equal those of f * drazinInverse f, and f * (1 - f * drazinInverse f) is nilpotent.
  authors: [Formal Frontier Agents]
  responsible_maintainers: [Formal Frontier Agents]
  license: Apache-2.0
sources:
  - title: The K-book
    authors: [Charles A. Weibel]
    type: book
    location: Chapter II, Section 6 (additive functions and Euler characteristics)
    relationship: adapts
    note: Motivates the SES-additive formulation and Euler argument; no K0 presentation or whole-source coverage is claimed.
  - title: Cohomology of Number Fields
    authors: [Jürgen Neukirch, Alexander Schmidt, Kay Wingberg]
    type: book
    location: Corrected second edition, (1.3.1)
    relationship: adapts
    note: The abelian-group snake diagram motivates an arbitrary-abelian-category endpoint construction. The endpoint universal properties and exactness at all six interior objects hold without assuming zero exterior objects; no source-coverage decision is claimed.
  - title: Original proof exposition for SES-additive Euler invariants
    authors: [Formal Frontier Agents]
    type: original-proof
    relationship: adapts
    note: Formal Frontier Agents authored the original Euler, exact-functor, degreewise-SES and LES mathematical expositions and the original core, length, exact-functor, cochain LES, shift, finite-support and finite-interval cochain Euler Lean proofs and clients. No external source asset is redistributed. Mathlib Single credits Kim Morrison (2021), SingleHomology credits Joël Riou (2023), ShiftSequence credits Joël Riou (2024), and opposite-complex work credits Johan Commelin, Amelia Livingston and Joël Riou (2022).
  - title: Original fixed-arrow cochain relative-path exposition and Lean implementation
    authors: [Formal Frontier Agents]
    type: original-proof
    relationship: adapts
    note: Formal Frontier Agents authored the original bounded mathematical exposition and the original Lean construction and client. Mathlib HomotopyFiber and path-object credit remains with Joël Riou (2023) under upstream Apache-2.0. No external source asset or source-specific correspondence is included.
  - title: Original chosen-cokernel quotient-intersection construction and Lean implementation
    authors: [Formal Frontier Agents]
    type: original-proof
    relationship: adapts
    note: Formal Frontier Agents authored the original bounded mathematical exposition and the original Lean proof and client. The library adaptation preserves the mathematics and does not constitute a new mathematical proof. Mathlib and project retain separate Apache-2.0 attribution; no external source asset or source correspondence is included.
  - title: Original quadrant product-total assembly and Lean implementation
    authors: [Formal Frontier Agents]
    type: original-proof
    relationship: adapts
    note: Formal Frontier Agents developed the original mathematical assembly, Lean proof, client and aggregate API. The library adaptation preserves the mathematics and does not constitute a new mathematical proof. No source asset is distributed; original mathlib definitions retain separate upstream credit and Apache-2.0 rights.
  - title: Original admissible-layer lower-cut reflector and Lean construction
    authors: [Formal Frontier Agents]
    type: original-proof
    relationship: adapts
    note: Formal Frontier Agents authored the original layer structure and lower-cut Lean interfaces, repaired the proof, exposed its equations and authored the client. The assembly and library adaptation of existing interfaces preserve the mathematics and do not constitute a new mathematical proof. No external source asset or source correspondence is included; mathlib retains separate upstream Apache-2.0 attribution.
status:
  scope: SES-additive finite-interval chain and cochain Euler identities with both endpoint-image corrections, neighbor-vanishing and term-bounded corollaries, acyclic zero and quasi-isomorphism invariance when both complexes share a term-support bound; finite-length module instance for commutative Noetherian Artinian rings; degreewise-SES signed term and bounded homology additivity; exact-functor transport and mapped homology comparison under finite-limit and finite-colimit preservation; finite-support invariance, native cochain shift by i+n with support shift -n, and negative-degree, torsion and identity-differential examples. The nonempty-interval cochain LES homology sum subtracts both connecting-image corrections and has outer-homology-vanishing and native IsGE/IsLE corollaries without a bound on the middle complex; its rational client is genuinely nonsplit. No empty-interval LES formula, canonical infinite/homology-only Euler invariant, general derived-category result or K0 presentation is claimed. For a fixed arrow, the integer cochain relative path uses preadditivity, binary biproducts and pullbacks and gives strict section/endpoints and chosen-homotopy lifts, with a relative contraction rather than a strict second inverse; the native-cylinder endpoint law requires no pullbacks. No arbitrary-arrow naturality or new quasi-isomorphism instance is claimed. The chosen quotient-intersection pair is monic in arbitrary abelian categories with independent universes for L ≤ U and arbitrary D; neither projection is asserted monic, nor is L ≤ D or quotient lifting assumed. Its property-transfer client uses subobject/product closure. Admissible layers reverse the lower order and have an inclusion requiring no closure and a lower-cut left adjoint, unit and exact reflector identity under subobject/product closure and P(cokernel D.arrow); no upper cut, ambient-D transport, Q-comma or filtration theorem is claimed. Product totals over any Ring use unrestricted diagonal products in degree p-r with horizontal plus signed vertical differential and zero vertical contribution at r=0; map laws need no exactness and acyclicity in every integer degree assumes every horizontal row acyclic including p=0. Chosen primitives are not linear/natural splittings and require no convergence or exact-products assumption. The nonsplit mod-two client repeats a nonzero row infinitely often overall but has zero vertical maps and only finitely many nonzero cells on each diagonal (at most three); it does not test infinitely supported diagonals or nonzero vertical maps. No source-coverage decision follows from these library results. For an arbitrary abelian category and ShortComplex.SnakeInput, the eight-object snake diagram has canonical endpoint maps with kernel and cokernel universal properties; its six interior positions are exact using the Mathlib middle six-term snake lemma. Its mod-three test has nonzero exterior objects and a positive connector different from its negative independently of the full-exactness theorem; the combined example uses that theorem. The Fitting results give eventual complementarity of canonical power kernels and images, the actual binary-biproduct copairing as an isomorphism, nilpotent kernel restriction and invertible image restriction on one common tail; object and morphism universes are independent in the categorical results, and the module bridges retain independent scalar and carrier universes. An arbitrary intertwiner f≫p=p≫g induces a natural square of the power-kernel/image copairings at every exponent, requiring only zero morphisms, the displayed kernels and images, the image map of that square and the two displayed biproducts. When X and Y are each Noetherian and Artinian in an abelian category, their canonical copairings are isomorphisms on one common tail and the coordinate expression of p is the binary biproduct map of its induced kernel and image maps. No monicity, epicity, invertibility or supplied splitting of p is assumed. Separately, in any category with zero morphisms, a morphism intertwining a nilpotent endomorphism with a monomorphic endomorphism is zero; dually, an epimorphic source endomorphism and nilpotent target endomorphism force that morphism to vanish. Object and morphism universes are independent. Categorical Artinianity agrees with module Artinianity under the canonical subobject–submodule order isomorphism. An indecomposable Noetherian and Artinian object has a local canonical endomorphism ring, and each endomorphism is nilpotent or a unit; no commutativity or extra nontriviality hypothesis is required. Conversely, in any preadditive category with binary biproducts, an object with a local canonical endomorphism ring satisfies Mathlib's original Indecomposable predicate. Object and morphism universes are independent; no abelian structure, Noetherianity, Artinianity, chosen zero object or extra nontriviality is assumed. Finite indecomposable decompositions require either one-sided object chain condition, zero morphisms and finite biproducts, with independent object and morphism universes; no preadditivity, abelianity, idempotent completeness or uniqueness is assumed. For an object satisfying both chain conditions in an abelian category, the finite decomposition has local canonical endomorphism rings on every factor, with independent object and morphism universes and the empty decomposition for zero; no commutativity or supplied decomposition is assumed. In any preadditive category, a finite biproduct of objects with local canonical, possibly noncommutative endomorphism rings cancels from binary biproducts with arbitrary remainders. Only the common full sum and the two binary totals are assumed to exist; no intermediate sums, abelian structure, chain conditions or idempotent completeness are required. Object, morphism and index universes are independent, the family may be empty, and no canonical residual isomorphism or residual-block invertibility is asserted. A Noetherian and Artinian object X cancels from X⊞Y≅X⊞Z, yielding Nonempty(Y≅Z) for arbitrary Y and Z. Neither remainder has a locality, chain-condition, finiteness or nonzero premise, and the endomorphism ring of X need not be local. Object and morphism universes remain independent, zero X is included, and no canonical isomorphism is selected. In a preadditive category, two given finite biproducts of factors with local canonical endomorphism rings have matching factors whenever their totals are isomorphic; the index equivalence need not be unique. Object, morphism and both index universes are independent, with no global biproduct or chain-condition assumption. With independent object and morphism universes in an abelian category, every endomorphism f of a fixed Noetherian and Artinian object X has a noncomputable value End.drazinInverse f in the original End X, where p * q = q ≫ p. It is the unique g satisfying Commute f g, g * f * g = g and an existential natural-number power equation f ^ (n + 1) * g = f ^ n. Only g is unique; exponent zero is allowed, and no Drazin index is selected. The value is zero iff f is nilpotent, agrees with CategoryTheory.inv f under IsIso f, fixes idempotents and gives IsIdempotentElem (f * End.drazinInverse f). Existence uses the kernel–image Fitting copairing and invertible image restriction at one common positive power, transported by Mathlib's Iso.conj. No nonzero-object, commutativity, smallness, scalar or supplied-decomposition hypothesis is required. For p = f * End.drazinInverse f, the canonical kernel and image subobjects of f ^ n eventually equal those of p, and f * (1 - p) is nilpotent. No threshold or positive index is supplied; positivity is derived internally, including the characteristic-exponent-zero case.
