version: "v0.4"
project:
  name: Formal Frontier Homological Algebra
  description: Finite Euler sums for chain and cochain complexes, with native exact-sequence, exact-functor and shift results, plus fixed-arrow relative paths of integer cochain maps in preadditive categories with binary biproducts and pullbacks, and an independent chosen-cokernel quotient-intersection pairing in abelian categories.
  authors: [Formal Frontier Agents]
  responsible_maintainers: [Anchor, Atlas, Beacon, Lattice, Prism]
  license: Apache-2.0
sources:
  - title: The K-book
    authors: [Charles A. Weibel]
    type: book
    location: Chapter II, Section 6 (additive functions and Euler characteristics)
    relationship: adapts
    note: Motivates the SES-additive formulation and Euler argument; no K0 presentation or whole-source coverage is claimed.
  - title: Original proof exposition for SES-additive Euler invariants (2026)
    authors: [Prism]
    contributors:
      - name: Formalization Worker A
        role: Core, finite-length, exact-functor and native cochain LES Lean proofs and clients; independent native-shift review
      - name: Formalization Worker B
        role: Native cochain-shift, finite-support and finite-interval cochain Euler Lean proofs and clients; independent exact-functor review; separate LES module-name promotion
    type: original-proof
    relationship: adapts
    note: Prism authored the original expanded Euler proof exposition, exact-functor/degreewise-SES and native LES guidance and assembled the accepted LES candidate, distinct from Worker A's native LES Lean proofs and clients. Worker A also wrote the core, finite-length and exact-functor Lean proofs and clients and reviewed the native shift; Worker B wrote the native shift/reindexing and finite-interval cochain Euler Lean proofs and clients, reviewed the exact-functor component, and separately promoted the unchanged LES mathematics by module-name mapping. The mathematical predecessors were accepted in the private incubator before separate module-name promotions. No external source asset is redistributed. Upstream mathlib Single is credited to Kim Morrison (2021), SingleHomology to Joël Riou (2023), ShiftSequence to Joël Riou (2024), and opposite-complex work to Johan Commelin, Amelia Livingston and Joël Riou (2022).
  - title: Original fixed-arrow cochain relative-path exposition and native implementation (2026)
    authors: [Prism, Formalization Worker B]
    contributors:
      - name: Formalization Worker A
        role: Independent review of the original fixed-arrow native mathematics
      - name: Folio
        role: Preparation of the five existing-result README headline groups
    type: original-proof
    relationship: adapts
    note: Prism authored the mathematical exposition; Formalization Worker B authored the original native Lean construction and ordinary client (Hive Task hive-request-fae080dd07fdf5cf986cc600319c01ebf8271371, UID 070c9eba-ff70-465a-8383-3ffdc2b110c1), independently reviewed by Worker A (Hive Task hive-request-213488f87188eb5d52235967c3d67b58d3ca1cbc, UID 03bd08e1-93fa-41b1-9b64-2ed81b81433b). The present math-preserving transfer is by Worker B Hive Task hive-request-224a7792d493a4b668c932da24232f93a60642c0, UID bf2c9417-99e4-4761-ab16-128be5c5c63f, and underwent destination-specific native checks and fresh independent Worker A review before Prism code acceptance on 2026-09-28. The native mathlib HomotopyFiber/path-object author is Joël Riou (2023); upstream Apache-2.0 license and authorship remain separate. No external source asset or source-specific correspondence is included.
  - title: Original chosen-cokernel quotient-intersection construction and Lean implementation (2026)
    authors: [Prism, Formalization Worker B]
    contributors:
      - name: Formalization Worker A
        role: Independent review of the isolated chosen-cokernel Lean proof and client
      - name: Formalization Worker B
        role: Bounded module-name transfer into this library; no new proof
    type: original-proof
    relationship: adapts
    note: Prism developed the bounded original mathematical exposition, independently reviewed on the source side. Formalization Worker B authored the original accepted isolated proof and client (Hive Task hive-request-59643abfde1a8dd0ffae0b74aeb5518528184e0a, UID ebab1c52-31bc-4958-a9b9-dd1e2af1f886), independently reviewed by Worker A (Hive Task hive-request-043c1a45f09fcb84652dcb8d6d12ae7b7ea2d2de, UID 6fa72f02-d851-498f-aee8-4153f483fbf9). Separate Worker B Hive Task hive-request-91a19ea3ef3b49cdeaf5331d2328a9efccb3dea9, UID cff40757-b7f6-4129-a7e7-c0158508e901, transferred the mathematics to this destination with the producer body unchanged and the client import renamed. At transfer preparation on 2026-09-29, destination-specific checks and review were pending. Exact destination 3c988935e773c51be6387e3fdb8e1e8a755d3704 subsequently passed the native both-root build and private/generated standard-axiom audit, received fresh independent Worker A mapped review (Hive Task hive-request-ea32421a8f837416638c6e19b57c629a30246d9a, UID 857dea85-e952-4d2e-aa25-cafa0f1c8a70), and was accepted and integrated by Prism on 2026-09-29. Prism prepared the subsequent lifecycle and credit update without changing mathematical code. Separate exact-revision release decisions are not implied by this code history. No external source asset or source correspondence is included; imported mathlib retains upstream authorship and Apache-2.0 rights.
status:
  scope: SES-additive finite-interval chain and cochain Euler identities, including both cochain endpoint images, neighbor-vanishing and term-bounded equalities, acyclic zero and common-term-supported quasi-isomorphism invariance; finite-length module instance, degreewise-SES signed term and bounded homology additivity, exact-functor transport and mapped homology comparison; finite-support independence and reindexing, actual native cochain-shift term and homology sums, with negative-degree split-SES, identity-functor, negative/shifted ZMod 3 and nonzero-identity-differential boundary clients; native exact-pair invariant identity and finite-interval cochain long-exact-sequence homology additivity with both connecting-image corrections for a ≤ b including singleton intervals, neighboring homology-vanishing and native outer-complex IsGE/IsLE corollaries, and nonsplit rational nonzero-connecting-map and shifted ZMod 3 clients. No empty-interval LES additivity, canonical interval-independent invariant, source-coverage, K0, homology-only bounded Euler, derived quotient or derived-category result, unrestricted long-exact-sequence theory or homologically bounded-category claim. Fixed-arrow integer cochain relative paths add the native path-object pullback, strict section and chosen-homotopy lifts, relative contraction and literal homotopy equivalence under preadditivity, binary biproducts and pullbacks. The cylinder and integer endpoint lemmas need no pullbacks. No naturality in arbitrary arrows or native quasi-isomorphism instance is claimed; the destination mathematics was checked, independently reviewed and accepted at f58ffbbf7becf28fc6a99ca74bd625fa269b34c2 on 2026-09-28. Release review and publication are separate revision-specific decisions. Added independently is the chosen quotient-intersection pairing in any abelian category, for subobjects L ≤ U and arbitrary D, with chosen cokernel components, aggregate factorization and monicity of the pair; neither component is asserted monic and no L ≤ D is needed. The isolated donor was independently reviewed and accepted. Exact destination 3c988935e773c51be6387e3fdb8e1e8a755d3704 subsequently passed the native both-root build and complete private/generated standard-axiom audit, received fresh independent mapped review, and was accepted and integrated by Prism on 2026-09-29. This is code acceptance, not a claim of separate release approval or official publication.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Classical.choice, Quot.sound]
