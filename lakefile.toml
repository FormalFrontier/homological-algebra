name = "homological_algebra"
version = "0.1.0"
lintDriver = "batteries/runLinter"
defaultTargets = ["HomologicalAlgebra", "HomologicalAlgebraTest"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "83abb3e776bdefcbc447a1e44d0debe4010039e5"

[[lean_lib]]
name = "HomologicalAlgebra"

[[lean_lib]]
name = "HomologicalAlgebraTest"

# Mathematical test fixtures may consist entirely of private declarations.
[lean_lib.leanOptions]
weak.linter.privateModule = false
